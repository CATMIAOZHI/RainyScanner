name: Build & Release APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Set Signing Credentials
        run: |
          echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Run lint
        run: ./gradlew lintRelease --no-daemon || true

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          APK_DIR="app/build/outputs/apk/release"
          if [ -f "$APK_DIR/app-release.apk" ]; then
            cp "$APK_DIR/app-release.apk" "RainyScanner-${{ github.ref_name }}.apk"
          elif [ -f "$APK_DIR/app-release-unsigned.apk" ]; then
            echo "⚠️ APK is unsigned (signing credentials may be wrong), copying unsigned version"
            cp "$APK_DIR/app-release-unsigned.apk" "RainyScanner-${{ github.ref_name }}.apk"
          else
            echo "❌ No APK found in $APK_DIR"
            ls -la "$APK_DIR"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RainyScanner-apk
          path: RainyScanner-${{ github.ref_name }}.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: RainyScanner-apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🌧️ RainyScanner ${{ github.ref_name }}"
          body: |
            ## 🌧️ RainyScanner - 雨晴扫描

            基于 Jetpack Compose 的 Android 条码/二维码扫描应用。

            ### ✨ 特性
            - Jetpack Compose + Material Design 3
            - CameraX + ZXing 扫描引擎
            - 扫描历史记录
            - 樱粉主题配色

            ### 📱 安装
            下载 APK 文件直接安装。

            ---
            **版本**: `${{ github.ref_name }}`
          files: RainyScanner-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}